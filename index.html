<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Bliss Café</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8ef;
      color: #4b3025;
      text-align: center;
      padding: 30px;
    }
    h1 { color: #875332; }
    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 15px;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <h1>☕ Morning Bliss Café</h1>
  <p>Start your day with happiness!</p>

  <div class="card">
    <h2>Welcome to Our Café</h2>
    <p>Fresh coffee, delicious pastries,
    and friendly customer service.</p>
  </div>

  <div class="card">
    <h2>Our Menu</h2>
    <p>Latte - $4.50</p>
    <p>Cappuccino - $4.00</p>
    <p>Americano - $3.50</p>
    <p>Blueberry Muffin - $3.00</p>
  </div>

  <div class="card">
    <h2>Customer Support</h2>
    <p>Our virtual assistant is coming soon!</p>
  </div>
</body>
</html>
